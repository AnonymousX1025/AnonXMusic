[project]
name = "anonxmusic"
version = "3.0.3"
description = "Telegram Group Calls Streaming bot with some useful features."
readme = ".github/README.md"
requires-python = ">=3.11"

dependencies = [
    "aiohttp~=3.14.5",
    "kuricrypt~=0.1.1",
    "kurigram==2.2.25",
    "ntgcalls~=3.0.6",
    "pillow>=12.3,<13.1",
    "psutil~=7.2.2",
    "py-tgcalls~=3.0.0",
    "py-yt-search~=0.8.2",
    "pymongo~=4.19.0",
    "python-dotenv~=1.2.4",
    "uvloop~=0.23.0 ; sys_platform != 'win32'",
    "yt-dlp[default]>=2026.10.26",
]
